name: smartcity

services:
  postgres:
    image: postgres:16
    container_name: smartcity-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data


  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    environment:
      CLUSTER_NAME: smartcity
    env_file: ./hadoop/hadoop.env
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - hdfs_name:/hadoop/dfs/name
      - ./hadoop:/scripts
      - ./data:/data

  datanode1:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode1
    environment:
      SERVICE_PRECONDITION: "namenode:9870"
    env_file: ./hadoop/hadoop.env
    volumes:
      - hdfs_data1:/hadoop/dfs/data
    depends_on:
      - namenode

  datanode2:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode2
    environment:
      SERVICE_PRECONDITION: "namenode:9870"
    env_file: ./hadoop/hadoop.env
    volumes:
      - hdfs_data2:/hadoop/dfs/data
    depends_on:
      - namenode   


  resourcemanager:
    image: bde2020/hadoop-resourcemanager:2.0.0-hadoop3.2.1-java8
    container_name: resourcemanager
    environment:
      SERVICE_PRECONDITION: "namenode:9000 namenode:9870 datanode1:9864 datanode2:9864"
    env_file: ./hadoop/hadoop.env
    ports:
      - "8088:8088"
    depends_on:
      - namenode

  nodemanager:
    image: bde2020/hadoop-nodemanager:2.0.0-hadoop3.2.1-java8
    container_name: nodemanager
    environment:
      SERVICE_PRECONDITION: "namenode:9000 namenode:9870 datanode1:9864 resourcemanager:8088"
    env_file: ./hadoop/hadoop.env
    volumes:
      - ./hadoop:/scripts
    depends_on:
      - resourcemanager

  spark:
    image: apache/spark:3.5.3-scala2.12-java17-python3-ubuntu
    container_name: spark
    user: root
    command: ["sleep", "infinity"]
    env_file: .env
    ports:
      - "4040:4040"
    volumes:
      - ./spark:/opt/spark-apps
    depends_on:
      - namenode
      - postgres             

volumes:
  pg_data:
  hdfs_name:
  hdfs_data1:
  hdfs_data2:
